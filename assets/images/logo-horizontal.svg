<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" role="img" aria-labelledby="jn-logo-h-title">
  <title id="jn-logo-h-title">JelajahNusa — Discover Indonesia, Your Way</title>
  <defs>
    <linearGradient id="lhForest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A7C5F"/>
      <stop offset="100%" stop-color="#1E4035"/>
    </linearGradient>
    <linearGradient id="lhSage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C8B6E"/>
      <stop offset="100%" stop-color="#2E6652"/>
    </linearGradient>
    <linearGradient id="lhGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0C46A"/>
      <stop offset="100%" stop-color="#D4923A"/>
    </linearGradient>
    <linearGradient id="lhDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A5C47"/>
      <stop offset="100%" stop-color="#142E26"/>
    </linearGradient>
  </defs>

  <!-- ===== EMBLEM (skala ~0.47 dari viewBox 200x200 → ~94x94) ===== -->
  <g transform="translate(3, 3) scale(0.47)">
    <!-- Sayap atas utama -->
    <path fill="url(#lhForest)"
      d="M 20 95 C 28 60, 55 40, 85 50 C 100 55, 112 68, 130 66 C 145 64, 158 52, 175 40 C 168 62, 155 80, 135 88 C 116 95, 98 86, 83 75 C 64 60, 42 58, 20 95 Z"/>
    <!-- Sayap dalam bawah -->
    <path fill="url(#lhSage)"
      d="M 28 108 C 50 94, 68 100, 84 116 C 98 130, 112 140, 133 130 C 116 150, 92 158, 70 148 C 50 138, 38 122, 28 108 Z"/>
    <!-- Ombak bawah -->
    <path fill="url(#lhDeep)"
      d="M 64 142 C 82 155, 106 158, 128 145 C 144 135, 156 118, 170 108 C 163 132, 148 154, 126 165 C 100 178, 68 170, 54 152 C 47 142, 50 128, 60 122 C 57 132, 58 138, 64 142 Z"/>
    <!-- Ruang negatif putih -->
    <path fill="#FFFFFF"
      d="M 38 118 C 58 112, 70 124, 82 136 C 94 148, 108 150, 122 142 C 107 160, 84 160, 68 148 C 56 138, 48 128, 38 118 Z"
      opacity="0.90"/>
    <!-- Aksen paruh -->
    <path fill="#C8883A" d="M 173 40 L 186 32 L 178 48 Z"/>
    <!-- Pin lokasi -->
    <path fill="url(#lhGold)"
      d="M 100 8 C 87 8, 76 19, 76 32 C 76 50, 100 72, 100 72 C 100 72, 124 50, 124 32 C 124 19, 113 8, 100 8 Z"/>
    <circle cx="100" cy="31" r="9" fill="#FFFFFF"/>
    <circle cx="100" cy="31" r="3" fill="url(#lhGold)" opacity="0.5"/>
  </g>

  <!-- ===== WORDMARK (teks putih untuk background gelap) ===== -->
  <!-- Nama brand utama -->
  <text x="108" y="60"
    font-family="'Georgia', 'Times New Roman', serif"
    font-size="42"
    font-weight="700"
    letter-spacing="-1"
    fill="#FFFFFF">JelajahNusa</text>
  <!-- Tagline -->
  <text x="110" y="80"
    font-family="'Arial', 'Helvetica Neue', sans-serif"
    font-size="11.5"
    font-weight="500"
    letter-spacing="2.8"
    fill="rgba(255,255,255,0.80)">DISCOVER INDONESIA, YOUR WAY</text>
</svg>
